<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardian</title>
    <script>
      (() => {
        try {
          // Purge legacy personal theme keys — API is source of truth
          try {
            var remove = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && (k === 'guardian-admin-theme' || k.indexOf('guardian-admin-theme:') === 0)) remove.push(k);
            }
            remove.forEach(function (key) { localStorage.removeItem(key); });
          } catch (e) {}
          // Public FOUC: safe default only. Brand theme hydrates from GET /api/v1/platform/theme.
          // Do not apply stale guardian-theme / guardian-admin-theme as authority.
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } catch(e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
