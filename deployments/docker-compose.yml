name: guardian-cloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardian}
      POSTGRES_DB: guardian_cloud
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian_cloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5434:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6381:6379"

  # Catches every outbound mail in development (verification, password reset,
  # email OTP, staff invitations). Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:1026:1025"  # SMTP
      - "127.0.0.1:8026:8025"  # web UI

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://guardian:${POSTGRES_PASSWORD:-guardian}@postgres:5432/guardian_cloud?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      GUARDIAN_PLATFORM_DEV_TOKEN: ${GUARDIAN_PLATFORM_DEV_TOKEN:-guardian-dev-super-admin}
      PUBLIC_BASE_URL: http://127.0.0.1:8083
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://127.0.0.1:5175}
      AUTH_LEGACY_MODE: ${AUTH_LEGACY_MODE:-on}
      AUTH_COOKIE_SECURE: "false"  # dev only; must be true behind https
      GUARDIAN_SECRET_ENCRYPTION_KEY: "${GUARDIAN_SECRET_ENCRYPTION_KEY:?generate with: openssl rand -base64 32}"
      # Empty: X-Forwarded-For is ignored, the transport peer is authoritative.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-Guardian <no-reply@guardian.local>}
    ports:
      - "127.0.0.1:8083:8083"

volumes:
  postgres_data:
  redis_data:
