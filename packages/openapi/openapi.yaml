openapi: 3.0.3
info:
  title: Guardian Cloud API
  version: 0.1.0
  description: |
    Phase 1 F1.0 stub. Path boundaries follow LLD Section 27.
    Auth, devices, events, and billing handlers land in later Phase 1 features.
servers:
  - url: http://127.0.0.1:8083
    description: Local API
paths:
  /healthz:
    get:
      summary: Liveness
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  request_id:
                    type: string
  /api/v1/auth/signup:
    post:
      summary: Create account (F1.1)
      operationId: authSignup
      responses:
        '501':
          description: Not implemented yet
  /api/v1/auth/login:
    post:
      summary: Login (F1.1)
      operationId: authLogin
      responses:
        '501':
          description: Not implemented yet
  /api/v1/auth/logout:
    post:
      summary: Logout (F1.1)
      operationId: authLogout
      responses:
        '501':
          description: Not implemented yet
  /api/v1/auth/me:
    get:
      summary: Current user (F1.1)
      operationId: authMe
      responses:
        '501':
          description: Not implemented yet
  /api/v1/tenants/current:
    get:
      summary: Current tenant (F1.2)
      operationId: tenantsCurrent
      responses:
        '501':
          description: Not implemented yet
  /api/v1/devices:
    get:
      summary: List devices (F1.7)
      operationId: devicesList
      responses:
        '501':
          description: Not implemented yet
  /api/v1/events:
    get:
      summary: List security events (F1.9)
      operationId: eventsList
      responses:
        '501':
          description: Not implemented yet
  /api/v1/billing/subscription:
    get:
      summary: Current subscription (F1.11)
      operationId: billingSubscription
      responses:
        '501':
          description: Not implemented yet
components:
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
